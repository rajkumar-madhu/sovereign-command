name: grok-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Grok CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Review PR
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          grok -p "Review GitHub PR #${PR_NUMBER} for bugs, regressions, and security issues.
          Base: ${BASE_SHA}
          Head: ${HEAD_SHA}

          1. Inspect only git diff ${BASE_SHA}...${HEAD_SHA} and nearby context.
          2. Post one GitHub review with:
             gh pr review ${PR_NUMBER} --comment --body \"...\"
             Use --request-changes only for blocking bugs.
          3. Do not edit files, commit, push, or run the app." \
            --always-approve \
            --deny "Edit" \
            --deny "Write" \
            --deny "Bash(git push*)" \
            --deny "Bash(git commit*)"
